<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rou-Ticker Premium - Animated Habit Tracker with AI Intelligence</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      color: white;
    }
    .loading-container {
      text-align: center;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      opacity: 0.9;
    }
  </style>
  <script>
    // Redirect based on authentication status
    window.addEventListener('load', function() {
      const token = localStorage.getItem('rou_token');
      if (token) {
        window.location.href = 'routicker_premium.html';
      } else {
        window.location.href = 'auth.html';
      }
    });
  </script>
</head>
<body>
  <div class="loading-container">
    <h1>Rou-Ticker Premium</h1>
    <p>Loading...</p>
  </div>
</body>
</html>
