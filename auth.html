<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rou-Ticker - Sign In / Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f6fafd;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #0a0a0a;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body.dark-mode {
      background: #0f1419;
      color: #f0f0f0;
    }

    /* Background Animation Canvas */
    #bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .auth-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .auth-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      width: 100%;
      padding: 50px;
      animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    body.dark-mode .auth-container {
      background: rgba(15, 20, 25, 0.95);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(56, 138, 221, 0.2) inset;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
      animation: fadeIn 0.8s ease-out forwards;
      opacity: 0;
      animation-delay: 0.1s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .logo-mark {
      width: 50px;
      height: 50px;
      margin-bottom: 15px;
      animation: float 4s ease-in-out infinite;
    }

    .logo-mark svg {
      width: 100%;
      height: 100%;
      stroke: #378ADD;
      fill: none;
      stroke-width: 2;
    }

    body.dark-mode .logo-mark svg {
      stroke: #56b3e8;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 500;
      color: #378ADD;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }

    body.dark-mode .logo-text {
      color: #56b3e8;
    }

    .logo-text em {
      font-style: normal;
      color: #667eea;
    }

    .logo-tag {
      color: #4a6a8c;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    body.dark-mode .logo-tag {
      color: #a0c4e8;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      color: #0a0a0a;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 500;
    }

    body.dark-mode h1 {
      color: #f0f0f0;
    }

    .subtitle {
      text-align: center;
      color: #378ADD;
      margin-bottom: 35px;
      font-size: 0.95rem;
      font-weight: 400;
    }

    body.dark-mode .subtitle {
      color: #56b3e8;
    }

    .form-group {
      margin-bottom: 20px;
      animation: slideInForm 0.6s ease-out forwards;
      opacity: 0;
    }

    @keyframes slideInForm {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    body.dark-mode label {
      color: #a0c4e8;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: #f9f9f9;
      color: #0a0a0a;
    }

    body.dark-mode input {
      background: #1a2332;
      border-color: #378ADD;
      color: #f0f0f0;
    }

    input:focus {
      outline: none;
      border-color: #378ADD;
      box-shadow: 0 0 0 4px rgba(55, 138, 221, 0.1), 0 0 0 1px #378ADD;
      background: white;
      transform: translateY(-2px);
    }

    body.dark-mode input:focus {
      background: #0f1419;
      box-shadow: 0 0 0 4px rgba(86, 179, 232, 0.15), 0 0 0 1px #56b3e8;
    }

    .form-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #378ADD 0%, #185FA5 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 10px 30px rgba(55, 138, 221, 0.2);
    }

    .form-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(55, 138, 221, 0.3);
    }

    .form-button:active {
      transform: translateY(-1px);
    }

    .form-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .toggle-form {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #666;
    }

    body.dark-mode .toggle-form {
      color: #a0c4e8;
    }

    .toggle-form button {
      background: none;
      border: none;
      color: #378ADD;
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
      font-size: 14px;
      transition: all 0.3s ease;
      padding: 0;
    }

    body.dark-mode .toggle-form button {
      color: #56b3e8;
    }

    .toggle-form button:hover {
      transform: translateY(-2px);
      color: #185FA5;
    }

    .error {
      background-color: #fee;
      border: 1.5px solid #f5a5a5;
      color: #c33;
      padding: 13px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease-out;
      font-weight: 500;
    }

    body.dark-mode .error {
      background-color: rgba(200, 50, 50, 0.1);
      border-color: #c33;
      color: #ff9999;
    }

    .error.show {
      display: block;
    }

    .success {
      background-color: #efe;
      border: 1.5px solid #a5f5a5;
      color: #3c3;
      padding: 13px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      animation: slideDown 0.3s ease-out;
      font-weight: 500;
    }

    body.dark-mode .success {
      background-color: rgba(50, 150, 50, 0.1);
      border-color: #3c3;
      color: #66ff66;
    }

    .success.show {
      display: block;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hidden {
      display: none;
    }

    /* Form group animation delays */
    .form-group:nth-child(1) { animation-delay: 0.2s; }
    .form-group:nth-child(2) { animation-delay: 0.3s; }
    .form-group:nth-child(3) { animation-delay: 0.4s; }
    .form-group:nth-child(4) { animation-delay: 0.5s; }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 45px;
      height: 45px;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: #378ADD;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      transition: all 0.3s ease;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    body.dark-mode .theme-toggle {
      background: rgba(30, 41, 59, 0.9);
      color: #56b3e8;
    }

    .theme-toggle:hover {
      transform: rotate(20deg) scale(1.05);
      box-shadow: 0 6px 20px rgba(55, 138, 221, 0.2);
    }

    .theme-icon {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Responsiveness */
    @media (max-width: 480px) {
      .auth-wrapper {
        max-width: 100%;
      }

      .auth-container {
        padding: 35px 25px;
        border-radius: 16px;
      }

      h1 {
        font-size: 26px;
      }

      .logo-mark {
        width: 40px;
        height: 40px;
      }

      .logo-text {
        font-size: 26px;
      }

      .form-button {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-animation" aria-hidden="true"></canvas>

  <div class="auth-wrapper">
    <!-- Sign In Form -->
    <div id="signin-form">
      <div class="auth-container">
        <div class="logo-section">
          <div class="logo-mark">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
          </div>
          <p class="logo-tag">Precision Habit Intelligence</p>
          <span class="logo-text">Rou<em>·</em>Ticker</span>
        </div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Build discipline through consistency</p>

        <div class="error" id="signin-error"></div>
        <div class="success" id="signin-success"></div>

        <div class="form-group">
          <label for="signin-email">Email Address</label>
          <input
            type="email"
            id="signin-email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="signin-password">Password</label>
          <input
            type="password"
            id="signin-password"
            placeholder="••••••••"
            required
          />
        </div>

        <button class="form-button" id="signin-btn" onclick="handleSignIn()">
          Sign In
        </button>

        <div class="toggle-form">
          Don't have an account?
          <button onclick="toggleForms()">Sign Up</button>
        </div>
      </div>
    </div>

    <!-- Sign Up Form -->
    <div id="signup-form" class="hidden">
      <div class="auth-container">
        <div class="logo-section">
          <div class="logo-mark">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
          </div>
          <p class="logo-tag">Precision Habit Intelligence</p>
          <span class="logo-text">Rou<em>·</em>Ticker</span>
        </div>

        <h1>Get Started</h1>
        <p class="subtitle">Start your journey to better habits today</p>

        <div class="error" id="signup-error"></div>
        <div class="success" id="signup-success"></div>

        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input
            type="text"
            id="signup-name"
            placeholder="John Doe"
            required
          />
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input
            type="email"
            id="signup-email"
            placeholder="you@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            placeholder="••••••••"
            required
          />
        </div>

        <div class="form-group">
          <label for="signup-password-confirm">Confirm Password</label>
          <input
            type="password"
            id="signup-password-confirm"
            placeholder="••••••••"
            required
          />
        </div>

        <button class="form-button" id="signup-btn" onclick="handleSignUp()">
          Create Account
        </button>

        <div class="toggle-form">
          Already have an account?
          <button onclick="toggleForms()">Sign In</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
    <svg viewBox="0 0 24 24" class="theme-icon">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <script src="lib/api.js?v=20260511"></script>
  <script>
    // ===== Background Particle Animation =====
    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.radius = Math.random() * 2 + 1;
        this.alpha = Math.random() * 0.5 + 0.3;
        this.targetX = x;
        this.targetY = y;
      }

      update() {
        this.x += (this.targetX - this.x) * 0.05;
        this.y += (this.targetY - this.y) * 0.05;
        
        this.x += this.vx * 0.5;
        this.y += this.vy * 0.5;
        
        if (this.x < 0 || this.x > window.innerWidth) this.vx *= -1;
        if (this.y < 0 || this.y > window.innerHeight) this.vy *= -1;
        
        this.x = Math.max(0, Math.min(window.innerWidth, this.x));
        this.y = Math.max(0, Math.min(window.innerHeight, this.y));
      }

      draw(ctx, isDarkMode) {
        ctx.fillStyle = isDarkMode 
          ? `rgba(86, 179, 232, ${this.alpha * 0.25})` 
          : `rgba(55, 138, 221, ${this.alpha * 0.35})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      magnetTo(x, y, strength = 0.8) {
        const dx = x - this.x;
        const dy = y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < 300) {
          const pullStrength = strength * (1 - distance / 300);
          this.targetX += (dx / distance) * pullStrength;
          this.targetY += (dy / distance) * pullStrength;
        }
      }
    }

    let particles = [];
    const canvas = document.getElementById('bg-animation');
    const ctx = canvas ? canvas.getContext('2d') : null;
    let mouseX = 0;
    let mouseY = 0;

    function initBgAnimation() {
      if (!canvas) return;
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      particles = [];
      const particleCount = Math.floor((canvas.width * canvas.height) / 15000);
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle(
          Math.random() * canvas.width,
          Math.random() * canvas.height
        ));
      }
    }

    function animateBg() {
      if (!canvas || !ctx) return;
      
      const isDarkMode = document.body.classList.contains('dark-mode');
      ctx.fillStyle = isDarkMode ? '#0f1419' : '#f6fafd';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(particle => {
        particle.magnetTo(mouseX, mouseY);
        particle.update();
        particle.draw(ctx, isDarkMode);
      });
      
      // Draw cursor glow
      const glowRadius = 150;
      const gradient = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, glowRadius);
      gradient.addColorStop(0, isDarkMode ? 'rgba(86, 179, 232, 0.04)' : 'rgba(55, 138, 221, 0.08)');
      gradient.addColorStop(1, isDarkMode ? 'rgba(86, 179, 232, 0)' : 'rgba(55, 138, 221, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(mouseX - glowRadius, mouseY - glowRadius, glowRadius * 2, glowRadius * 2);
      
      requestAnimationFrame(animateBg);
    }

    // Mouse tracking
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    window.addEventListener('resize', () => {
      if (canvas) {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

    // ===== Dark Mode Toggle =====
    const themeToggle = document.getElementById('theme-toggle');
    
    function initDarkMode() {
      const isDark = localStorage.getItem('rou-theme') === 'dark';
      if (isDark) {
        document.body.classList.add('dark-mode');
      }
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('rou-theme', isDark ? 'dark' : 'light');
    });

    // ===== Form Logic =====
    function toggleForms() {
      document.getElementById('signin-form').classList.toggle('hidden');
      document.getElementById('signup-form').classList.toggle('hidden');
      clearErrors();
    }

    function clearErrors() {
      document.querySelectorAll('.error, .success').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
    }

    function showError(formType, message) {
      const errorEl = document.getElementById(`${formType}-error`);
      errorEl.textContent = message;
      errorEl.classList.add('show');
    }

    function showSuccess(formType, message) {
      const successEl = document.getElementById(`${formType}-success`);
      successEl.textContent = message;
      successEl.classList.add('show');
    }

    function setButtonLoading(buttonId, isLoading) {
      const btn = document.getElementById(buttonId);
      btn.disabled = isLoading;
      btn.textContent = isLoading ? 'Loading...' : (buttonId === 'signin-btn' ? 'Sign In' : 'Create Account');
    }

    /**
     * Handle Sign In
     */
    async function handleSignIn() {
      clearErrors();
      const email = document.getElementById('signin-email').value.trim();
      const password = document.getElementById('signin-password').value;

      if (!email) {
        showError('signin', 'Email is required');
        return;
      }
      if (!password) {
        showError('signin', 'Password is required');
        return;
      }

      setButtonLoading('signin-btn', true);

      try {
        await window.rou.auth.login(email, password);
        showSuccess('signin', 'Login successful! Redirecting...');

        setTimeout(() => {
          window.location.href = 'routicker_premium.html';
        }, 1500);
      } catch (error) {
        showError('signin', error.message || 'Login failed. Please try again.');
        setButtonLoading('signin-btn', false);
      }
    }

    /**
     * Handle Sign Up
     */
    async function handleSignUp() {
      clearErrors();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const passwordConfirm = document.getElementById('signup-password-confirm').value;

      if (!name) {
        showError('signup', 'Name is required');
        return;
      }
      if (!email) {
        showError('signup', 'Email is required');
        return;
      }
      if (!password) {
        showError('signup', 'Password is required');
        return;
      }
      if (password.length < 6) {
        showError('signup', 'Password must be at least 6 characters');
        return;
      }
      if (password !== passwordConfirm) {
        showError('signup', 'Passwords do not match');
        return;
      }

      setButtonLoading('signup-btn', true);

      try {
        await window.rou.auth.signup(name, email, password);
        showSuccess('signup', 'Account created! Redirecting to app...');

        setTimeout(() => {
          window.location.href = 'routicker_premium.html';
        }, 1500);
      } catch (error) {
        showError('signup', error.message || 'Sign up failed. Please try again.');
        setButtonLoading('signup-btn', false);
      }
    }

    /**
     * Enter key handling
     */
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        if (document.getElementById('signin-form').classList.contains('hidden')) {
          handleSignUp();
        } else {
          handleSignIn();
        }
      }
    });

    /**
     * Initialize
     */
    window.addEventListener('load', () => {
      initDarkMode();
      initBgAnimation();
      animateBg();

      // Check if already logged in
      if (window.rou && window.rou.auth.isAuthenticated()) {
        window.location.href = 'routicker_premium.html';
      }
    });
  </script>
</body>
</html>
